name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} • ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux needs Ninja
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # (macOS and Windows runners already have cmake & ninja)

      - name: Configure (CMake + Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # If you have ctests, this will run them. Safe to leave; it no-ops if none.
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      # Optional: publish built binaries as artifacts
      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: khclone-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/**/*.exe
            build/**/*.pdb

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: khclone-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/**/khclone
            build/**/KHApp
